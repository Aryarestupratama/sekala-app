name: sekala_app
description: "SEKALA - Sejarah & Edukasi Kesehatan Alur Lintas Abad"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^18.0.0

  # Networking
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # Auth & storage
  flutter_secure_storage: ^11.0.0
  google_sign_in: ^7.2.0

  # Media
  # NOTE: video content block sudah pindah dari YouTube -> Google Drive
  # (WebView) -> native player (`video_player` + `chewie`), lihat
  # docstring `_DriveVideoBlockPlayer` di `content_block_view.dart`.
  # `webview_flutter` SEKARANG cuma dipakai untuk preview PDF
  # (`_PdfPreviewDialog`), bukan lagi untuk video. `youtube_player_iframe`
  # sudah tidak dipakai sama sekali dan sengaja tidak ditambahkan lagi.
  webview_flutter: ^4.8.0
  url_launcher: ^6.3.0
  video_player: ^2.9.2
  chewie: ^1.8.5

  # Image (foto tokoh & gambar section dari Google Drive link)
  cached_network_image: ^3.3.1

  # UI utilities
  google_fonts: ^8.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^4.0.0

  # Visibility tracking — dulu untuk auto-detect "selesai baca" (scroll
  # detection, sudah tidak dipakai lagi di alur ini sejak CTA manual,
  # lihat `section_detail_screen.dart`), sekarang dipakai untuk
  # dispose WebView player video Drive saat scroll keluar viewport
  # (`_DriveVideoBlockPlayer` di `content_block_view.dart`).
  visibility_detector: ^0.4.0+2

  # Utilities
  intl: ^0.20.3
  equatable: ^2.0.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Animasi reveal vaksin (locked -> unlocked) di halaman Koleksi & banner
  # notifikasi kuis selesai
  flutter_animate: ^4.5.0
  confetti: ^0.7.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Codegen
  build_runner: ^2.4.11
  freezed: ^4.0.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/