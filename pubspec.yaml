name: sekala_app
description: "SEKALA - Sejarah & Edukasi Kesehatan Alur Lintas Abad"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^18.0.0

  # Networking
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # Auth & storage
  flutter_secure_storage: ^11.0.0
  google_sign_in: ^7.2.0

  # Media (video YouTube, webview untuk kuis Upresenter & PDF Drive embed)
  # NOTE: `youtube_player_flutter` (9.1.1) diganti `youtube_player_iframe`
  # karena tombol play tidak merespons sama sekali di WebView Android
  # versi baru — root cause: package lama pakai JS bridge tersembunyi
  # (postMessage ke halaman IFrame API) yang mulai bentrok dengan update
  # Android System WebView terbaru (package lama sudah lama tidak
  # dimaintain aktif). `youtube_player_iframe` dibangun di atas
  # `webview_flutter` versi modern secara langsung (bukan trik JS bridge
  # terpisah), jadi lebih stabil untuk versi WebView sekarang & ke depan.
  youtube_player_iframe: ^5.2.1
  webview_flutter: ^4.8.0
  url_launcher: ^6.3.0

  # Image (foto tokoh & gambar section dari Google Drive link)
  cached_network_image: ^3.3.1

  # UI utilities
  google_fonts: ^8.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^4.0.0

  # Scroll detection (auto-detect "selesai baca")
  visibility_detector: ^0.4.0+2

  # Utilities
  intl: ^0.20.3
  equatable: ^2.0.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Animasi reveal vaksin (locked -> unlocked) di halaman Koleksi & banner
  # notifikasi kuis selesai
  flutter_animate: ^4.5.0
  confetti: ^0.7.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Codegen
  build_runner: ^2.4.11
  freezed: ^4.0.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/